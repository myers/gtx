[package]
name = "gt"
version = "0.3.1"
edition = "2024"
description = "Gitea CLI - like gh, but for Gitea"
license = "MIT"
build = "build.rs"

[[bin]]
name = "gt"
path = "src/main.rs"

[dependencies]
gitea-api = { path = "../gitea-api" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "rustls"] }
eyre = "0.6"
color-eyre = "0.6"
chrono = { version = "0.4", features = ["clock"] }
url = "2"
inquire = "0.7"
regex-lite = "0.1"
tempfile = "3"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
